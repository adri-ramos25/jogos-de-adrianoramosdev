<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/saia do rio page.css">
    <link rel="icon" href="src/images/saia do rio cover.png">
    <title>Saia do Rio</title>
</head>

<body>
    <header>
        <img id="minha-logo" src="src/images/saia do rio cover.png" alt="capa do jogo saia do rio" title="Capa do jogo">

        <a href="https://adrianoramosdev.itch.io/saia-do-rio/purchase?initiator=web" id="download-btn" alt="baixar o jogo saia do rio" title="Baixar o jogo">Baixar</a>
    </header>

    <main>
        <!-- descricao do jogo -->
        <section id="description-section">
            <div>
                <h1>Descrição</h1>

                <p>Explore o rio para achar a saída. Passe por obstáculos e inimigos que vão aparecer no seu caminho.</p>
            </div>
        </section>

        <!-- gameplay do jogo -->
        <section id="gameplay-section">
            <div>
                <h1>Gameplay</h1>

                <video controls alt="gameplay do jogo saia do rio">
                    <source src="src/videos/saia do rio gameplay.mp4">
                    Seu navegador não suporta vídeos.
                </video>
            </div>
        </section>
    </main>
</body>
</html>
